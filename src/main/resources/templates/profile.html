<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息 - 墨言</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/blog.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-blog fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/api/articles/index">📝 墨言</a>
        <div class="collapse navbar-collapse show">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/api/articles/index">← 返回首页</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="main-content">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0"><i class="bi bi-person-circle"></i> 个人信息</h4>
                    </div>
                    <div class="card-body p-4" th:if="${user != null}">
                        <div class="text-center mb-4">
                            <div class="comment-avatar mx-auto mb-3" style="width:80px;height:80px;font-size:2rem;">
                                <span th:text="${#strings.substring(user.nickname, 0, 1)}">U</span>
                            </div>
                            <h5 th:text="${user.nickname}">昵称</h5>
                            <span class="badge bg-primary" th:text="${user.role == 'admin' ? '管理员' : '普通用户'}">角色</span>
                        </div>

                        <form id="profileForm">
                            <div class="mb-3">
                                <label class="form-label">用户名</label>
                                <input type="text" class="form-control" th:value="${user.username}" disabled>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">昵称</label>
                                <input type="text" class="form-control" id="nickname" th:value="${user.nickname}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">邮箱</label>
                                <input type="email" class="form-control" id="email" th:value="${user.email}" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">保存修改</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>

<footer class="footer">
    <div class="container text-center">
        <small>© 2026 墨言 - 网络接口编程课程设计</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/blog.js"></script>
<script>
document.getElementById('profileForm')?.addEventListener('submit', async function(e) {
    e.preventDefault();
    const nickname = document.getElementById('nickname').value.trim();
    const email = document.getElementById('email').value.trim();

    if (!nickname || !email) {
        showToast('请填写完整信息', 'warning');
        return;
    }

    const result = await apiRequest(`${API_BASE}/users/profile`, 'PUT', { nickname, email });
    if (result && result.code === 200) {
        showToast('更新成功', 'success');
        localStorage.setItem('blog_user', JSON.stringify(result.data));
    } else {
        showToast(result.message || '更新失败', 'danger');
    }
});
</script>
</body>
</html>
