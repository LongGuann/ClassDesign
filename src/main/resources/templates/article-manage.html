<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的文章 - 博客管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/blog.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-blog fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/api/articles/index">📝 博客管理系统</a>
        <div class="collapse navbar-collapse show">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/api/articles/index">← 返回首页</a></li>
                <li class="nav-item"><a class="nav-link" href="/api/articles/create-page">写文章</a></li>
                <li class="nav-item"><a class="nav-link" href="#" id="logoutBtn">退出</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="main-content">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0"><i class="bi bi-journal-text"></i> 我的文章</h4>
            <a href="/api/articles/create-page" class="btn btn-primary"><i class="bi bi-plus-lg"></i> 写文章</a>
        </div>

        <div th:if="${pageResult != null and pageResult.total > 0}">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>标题</th>
                            <th>分类</th>
                            <th>状态</th>
                            <th>阅读</th>
                            <th>发布时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="article : ${pageResult.list}">
                            <td>
                                <a th:href="@{/api/articles/detail-page/{id}(id=${article.articleId})}"
                                   class="text-decoration-none fw-medium" th:text="${article.title}">标题</a>
                            </td>
                            <td><span class="category-badge" th:text="${article.categoryName}">分类</span></td>
                            <td>
                                <span class="badge bg-success" th:if="${article.status == 1}">已发布</span>
                                <span class="badge bg-warning text-dark" th:unless="${article.status == 1}">草稿</span>
                            </td>
                            <td th:text="${article.viewCount}">0</td>
                            <td class="small text-muted" th:text="${#temporals.format(article.createTime, 'yyyy-MM-dd HH:mm')}">时间</td>
                            <td>
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/api/articles/edit-page/{id}(id=${article.articleId})}"
                                       class="btn btn-outline-primary">编辑</a>
                                    <button class="btn btn-outline-danger"
                                            th:attr="onclick='deleteArticle(' + ${article.articleId} + ')'">删除</button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <nav th:if="${pageResult.pages > 1}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${pageResult.pageNum == 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/api/articles/manage-page(page=1)}">首页</a>
                    </li>
                    <li class="page-item" th:classappend="${pageResult.pageNum == 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/api/articles/manage-page(page=${pageResult.pageNum - 1})}">上一页</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(1, pageResult.pages)}"
                        th:classappend="${i == pageResult.pageNum} ? 'active'">
                        <a class="page-link" th:href="@{/api/articles/manage-page(page=${i})}" th:text="${i}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${pageResult.pageNum == pageResult.pages} ? 'disabled'">
                        <a class="page-link" th:href="@{/api/articles/manage-page(page=${pageResult.pageNum + 1})}">下一页</a>
                    </li>
                    <li class="page-item" th:classappend="${pageResult.pageNum == pageResult.pages} ? 'disabled'">
                        <a class="page-link" th:href="@{/api/articles/manage-page(page=${pageResult.pages})}">末页</a>
                    </li>
                </ul>
            </nav>
        </div>

        <div class="empty-state" th:unless="${pageResult != null and pageResult.total > 0}">
            <i class="bi bi-journal-text"></i>
            <h5 class="mt-3">还没有发布过文章</h5>
            <p class="text-muted">开始写下你的第一篇文章吧！</p>
            <a href="/api/articles/create-page" class="btn btn-primary">写文章</a>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>
<div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-body"><p id="confirmModalBody">确认执行此操作？</p></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="confirmModalBtn">确认</button>
            </div>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="container text-center">
        <small>© 2026 博客管理系统 - 网络接口编程课程设计</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/blog.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function() {
    if (!getToken()) {
        window.location.href = '/api/users/login-page';
    }
});

async function deleteArticle(id) {
    if (!await showConfirm('确定要删除这篇文章吗？')) return;
    const result = await apiRequest(`${API_BASE}/articles/${id}`, 'DELETE');
    if (result && result.code === 200) {
        showToast('删除成功', 'success');
        setTimeout(() => location.reload(), 500);
    } else {
        showToast(result.message || '删除失败', 'danger');
    }
}

document.getElementById('logoutBtn')?.addEventListener('click', function(e) {
    e.preventDefault();
    clearToken();
    window.location.href = '/api/articles/index';
});
</script>
</body>
</html>
