<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑文章 - 墨言</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/blog.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-blog fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/api/articles/index">📝 墨言</a>
        <div class="collapse navbar-collapse show">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/api/articles/detail-page/{id}(id=${article.articleId})}">← 返回文章</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="main-content">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0"><i class="bi bi-pencil-square"></i> 编辑文章</h4>
                    </div>
                    <div class="card-body p-4">
                        <form id="articleForm">
                            <input type="hidden" id="articleId" th:value="${article.articleId}">
                            <div class="mb-3">
                                <label class="form-label">文章标题 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="title" th:value="${article.title}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">文章分类 <span class="text-danger">*</span></label>
                                <select class="form-select" id="categoryId" required>
                                    <option value="">请选择分类</option>
                                    <option th:each="cat : ${categories}"
                                            th:value="${cat.categoryId}"
                                            th:text="${cat.name}"
                                            th:selected="${cat.categoryId == article.categoryId}">分类名</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">文章摘要</label>
                                <textarea class="form-control" id="summary" rows="2" maxlength="500" th:text="${article.summary}"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">文章正文 <span class="text-danger">*</span></label>
                                <textarea class="form-control" id="content" rows="15" required th:text="${article.content}"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">封面图片URL（可选）</label>
                                <input type="text" class="form-control" id="coverImage" th:value="${article.coverImage}">
                            </div>
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/api/articles/detail-page/{id}(id=${article.articleId})}" class="btn btn-outline-secondary">取消</a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg"></i> 保存修改
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/blog.js"></script>
<script>
document.getElementById('articleForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const articleId = document.getElementById('articleId').value;
    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();
    const categoryId = document.getElementById('categoryId').value;

    if (!title) { showToast('请输入文章标题', 'warning'); return; }
    if (!categoryId) { showToast('请选择文章分类', 'warning'); return; }
    if (!content) { showToast('请输入文章内容', 'warning'); return; }

    const result = await apiRequest(`${API_BASE}/articles/${articleId}`, 'PUT', {
        title,
        content,
        summary: document.getElementById('summary').value.trim(),
        coverImage: document.getElementById('coverImage').value.trim(),
        categoryId: parseInt(categoryId)
    });

    if (result && result.code === 200) {
        showToast('保存成功！', 'success');
        setTimeout(() => {
            window.location.href = `/api/articles/detail-page/${articleId}`;
        }, 500);
    } else {
        showToast(result.message || '保存失败', 'danger');
    }
});
</script>
</body>
</html>
