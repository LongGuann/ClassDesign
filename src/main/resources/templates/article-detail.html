<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${article.title} + ' - 博客管理系统'">文章详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/blog.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-blog fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/api/articles/index">📝 博客管理系统</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/api/articles/index">首页</a></li>
                <li class="nav-item" id="create-nav" style="display:none;"><a class="nav-link" href="/api/articles/create-page">写文章</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" id="login-nav"><a class="nav-link" href="/api/users/login-page">登录</a></li>
                <li class="nav-item d-none" id="user-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">👤 <span id="user-nickname">用户</span></a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="/api/articles/manage-page">我的文章</a></li>
                            <li><a class="dropdown-item" href="/api/users/profile-page">个人信息</a></li>
                            <li><a class="dropdown-item" href="/api/categories/manage-page">分类管理</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" id="logoutBtn">退出登录</a></li>
                        </ul>
                    </li>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="main-content">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- 文章内容 -->
                <div class="card article-detail">
                    <div class="card-body p-4">
                        <div class="mb-3">
                            <span class="category-badge" th:text="${article.categoryName}">分类</span>
                        </div>
                        <h1 class="article-title" th:text="${article.title}">标题</h1>
                        <div class="article-meta my-3">
                            <span><i class="bi bi-person"></i> <span th:text="${article.authorName}">作者</span></span>
                            <span><i class="bi bi-clock"></i> <span th:text="${#temporals.format(article.createTime, 'yyyy-MM-dd HH:mm')}">时间</span></span>
                            <span><i class="bi bi-eye"></i> <span th:text="${article.viewCount}">0</span> 次阅读</span>
                        </div>
                        <hr>
                        <div class="article-content" th:utext="${#strings.replace(article.content, newLine, '&lt;br&gt;')}">
                            正文内容
                        </div>

                        <!-- 操作按钮 -->
                        <div class="mt-4 d-flex gap-2" id="articleActions" style="display:none !important;">
                            <a th:href="@{/api/articles/edit-page/{id}(id=${article.articleId})}" class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-pencil"></i> 编辑
                            </a>
                            <button class="btn btn-outline-danger btn-sm" onclick="deleteArticle(${article.articleId})">
                                <i class="bi bi-trash"></i> 删除
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 评论区域 -->
                <div class="card mt-4">
                    <div class="card-header">
                        <i class="bi bi-chat-dots"></i> 评论
                        <span class="badge bg-secondary ms-2" id="commentCount">0</span>
                    </div>
                    <div class="card-body">
                        <!-- 发表评论 -->
                        <div class="mb-4" id="commentFormSection" style="display:none;">
                            <textarea class="form-control" id="commentContent" rows="2" placeholder="写下你的评论..." maxlength="500"></textarea>
                            <div class="mt-2 text-end">
                                <button class="btn btn-primary btn-sm" onclick="submitComment()">发表评论</button>
                            </div>
                        </div>
                        <div class="mb-3" id="loginHint">
                            <a href="/api/users/login-page" class="text-decoration-none">登录</a> 后即可发表评论
                        </div>

                        <!-- 评论列表 -->
                        <div id="commentList"></div>
                        <div class="empty-state" id="emptyComments">
                            <i class="bi bi-chat"></i>
                            <p class="mt-2">暂无评论，快来抢沙发吧~</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>
<div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-body"><p id="confirmModalBody">确认执行此操作？</p></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="confirmModalBtn">确认</button>
            </div>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="container text-center">
        <small>© 2026 博客管理系统 - 网络接口编程课程设计</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/blog.js"></script>
<script>
const articleId = [[${article.articleId}]];

async function loadComments() {
    const result = await apiRequest(`${API_BASE}/comments/list/${articleId}`);
    if (result && result.code === 200) {
        const comments = result.data;
        const list = document.getElementById('commentList');
        const empty = document.getElementById('emptyComments');
        const count = document.getElementById('commentCount');

        count.textContent = comments.length;

        if (comments.length === 0) {
            list.innerHTML = '';
            empty.style.display = 'block';
            return;
        }

        empty.style.display = 'none';
        list.innerHTML = comments.map(c => `
            <div class="comment-item">
                <div class="d-flex">
                    <div class="comment-avatar me-3">${(c.authorName || '?')[0]}</div>
                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between">
                            <div>
                                <span class="comment-author">${c.authorName || '匿名'}</span>
                                <span class="comment-time ms-2">${formatTime(c.createTime)}</span>
                            </div>
                        </div>
                        <div class="comment-content">${c.content}</div>
                    </div>
                </div>
            </div>
        `).join('');
    }
}

function formatTime(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    return d.getFullYear() + '-' +
        String(d.getMonth()+1).padStart(2,'0') + '-' +
        String(d.getDate()).padStart(2,'0') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' +
        String(d.getMinutes()).padStart(2,'0');
}

async function submitComment() {
    const content = document.getElementById('commentContent').value.trim();
    if (!content) {
        showToast('请输入评论内容', 'warning');
        return;
    }
    const result = await apiRequest(`${API_BASE}/comments`, 'POST', {
        content: content,
        articleId: articleId
    });
    if (result && result.code === 200) {
        document.getElementById('commentContent').value = '';
        showToast('评论成功！', 'success');
        loadComments();
    } else {
        showToast(result.message || '评论失败', 'danger');
    }
}

async function deleteArticle(id) {
    if (!await showConfirm('确定要删除这篇文章吗？')) return;
    const result = await apiRequest(`${API_BASE}/articles/${id}`, 'DELETE');
    if (result && result.code === 200) {
        showToast('删除成功', 'success');
        setTimeout(() => window.location.href = '/api/articles/index', 500);
    } else {
        showToast(result.message || '删除失败', 'danger');
    }
}

document.addEventListener('DOMContentLoaded', async function() {
    loadComments();

    const token = getToken();
    if (token) {
        const user = await fetchCurrentUser();
        if (user) {
            document.getElementById('commentFormSection').style.display = 'block';
            document.getElementById('loginHint').style.display = 'none';
            document.getElementById('create-nav').style.display = 'block';
            document.getElementById('login-nav').style.display = 'none';
            document.getElementById('user-nav').classList.remove('d-none');
            document.getElementById('user-nickname').textContent = user.nickname || user.username;

            // 显示文章操作按钮（作者本人或管理员）
            if (user.userId === [[${article.userId}]] || user.role === 'admin') {
                document.getElementById('articleActions').style.display = 'flex !important';
                document.getElementById('articleActions').classList.remove('d-none');
            }
        }
    }
});

document.getElementById('logoutBtn')?.addEventListener('click', function(e) {
    e.preventDefault();
    clearToken();
    showToast('已退出登录', 'success');
    setTimeout(() => window.location.href = '/api/articles/index', 500);
});
</script>
</body>
</html>
