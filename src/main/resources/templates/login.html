<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 博客管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/blog.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-title">📝 博客管理系统</div>
        <div class="auth-subtitle">欢迎回来，请登录您的账号</div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" class="form-control" id="username" placeholder="请输入用户名" required>
            </div>
            <div class="mb-3">
                <label class="form-label">密码</label>
                <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
            </div>
            <div class="mb-3">
                <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                    <span id="loginText">登 录</span>
                    <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                </button>
            </div>
        </form>

        <div class="text-center">
            <span class="text-muted">还没有账号？</span>
            <a href="/api/users/register-page" class="text-decoration-none">立即注册</a>
        </div>

        <div class="text-center mt-3">
            <small class="text-muted">演示账号：admin / 123456</small>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/blog.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!username || !password) {
        showToast('请输入用户名和密码', 'warning');
        return;
    }

    // 显示加载状态
    document.getElementById('loginText').classList.add('d-none');
    document.getElementById('loginSpinner').classList.remove('d-none');
    document.getElementById('loginBtn').disabled = true;

    const result = await apiRequest(`${API_BASE}/users/login`, 'POST', { username, password });

    // 恢复按钮状态
    document.getElementById('loginText').classList.remove('d-none');
    document.getElementById('loginSpinner').classList.add('d-none');
    document.getElementById('loginBtn').disabled = false;

    if (result && result.code === 200) {
        setToken(result.data);
        showToast('登录成功！', 'success');
        // 获取用户信息
        await fetchCurrentUser();
        setTimeout(() => {
            window.location.href = '/api/articles/index';
        }, 500);
    } else {
        showToast(result.message || '登录失败', 'danger');
    }
});
</script>
</body>
</html>
