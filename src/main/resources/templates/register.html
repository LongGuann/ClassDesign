<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 墨言</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/blog.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-title">📝 墨言</div>
        <div class="auth-subtitle">创建您的账号，开始分享</div>

        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" class="form-control" id="username" placeholder="3-50个字符" required>
                <div class="invalid-feedback">用户名长度应在3-50之间</div>
            </div>
            <div class="mb-3">
                <label class="form-label">昵称</label>
                <input type="text" class="form-control" id="nickname" placeholder="给自己取个名字" required>
            </div>
            <div class="mb-3">
                <label class="form-label">邮箱</label>
                <input type="email" class="form-control" id="email" placeholder="example@mail.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">密码</label>
                <input type="password" class="form-control" id="password" placeholder="至少6位密码" required>
            </div>
            <div class="mb-3">
                <label class="form-label">确认密码</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="再次输入密码" required>
            </div>
            <div class="mb-3">
                <button type="submit" class="btn btn-primary w-100" id="registerBtn">
                    <span id="registerText">注 册</span>
                    <span id="registerSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                </button>
            </div>
        </form>

        <div class="text-center">
            <span class="text-muted">已有账号？</span>
            <a href="/api/users/login-page" class="text-decoration-none">立即登录</a>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/blog.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const nickname = document.getElementById('nickname').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    // 表单校验
    if (!username || !nickname || !email || !password || !confirmPassword) {
        showToast('请填写所有字段', 'warning');
        return;
    }
    if (username.length < 3) {
        showToast('用户名至少3个字符', 'warning');
        return;
    }
    if (password.length < 6) {
        showToast('密码至少6位', 'warning');
        return;
    }
    if (password !== confirmPassword) {
        showToast('两次密码输入不一致', 'warning');
        return;
    }

    // 显示加载状态
    document.getElementById('registerText').classList.add('d-none');
    document.getElementById('registerSpinner').classList.remove('d-none');
    document.getElementById('registerBtn').disabled = true;

    const result = await apiRequest(`${API_BASE}/users/register`, 'POST', {
        username, nickname, email, password
    });

    document.getElementById('registerText').classList.remove('d-none');
    document.getElementById('registerSpinner').classList.add('d-none');
    document.getElementById('registerBtn').disabled = false;

    if (result && result.code === 200) {
        showToast('注册成功！即将跳转登录...', 'success');
        setTimeout(() => {
            window.location.href = '/api/users/login-page';
        }, 1500);
    } else {
        showToast(result.message || '注册失败', 'danger');
    }
});
</script>
</body>
</html>
